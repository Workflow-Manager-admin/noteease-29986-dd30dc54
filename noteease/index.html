<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteEase</title>
  </head>
  <body>
    <div id="app">
      <header id="app-header">
        <h1>NoteEase</h1>
      </header>
      <div id="search-sort-filter-container">
        <input type="text" id="search-bar" placeholder="Search notes..." />
        <div id="category-filters">
          <!-- Category filter buttons will be dynamically added here -->
        </div>
      </div>
      <div id="notes-list-container">
        <!-- Notes will be dynamically rendered here -->
      </div>
      <button id="add-note-fab">+</button>
      <div id="note-modal" class="modal" style="display: none;">
        <div class="modal-content">
          <span class="close-button">&times;</span>
          <h2 id="modal-title">Add Note</h2>
          <input type="text" id="note-title-input" placeholder="Title" />
          <textarea id="note-content-input" placeholder="Content"></textarea>
          <input type="text" id="note-category-input" placeholder="Category/Tag (comma-separated)" />
          <button id="save-note-button">Save Note</button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
